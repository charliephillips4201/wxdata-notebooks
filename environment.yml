name: wxdata-notebooks
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pandas=2.3.3
  - pyarrow=24.0.0
  - numpy=1.24.4
  - scipy=1.15.2
  - certifi
  - h5py=3.16.0
  - h5pyd=0.18.0
  - openpyxl
  - matplotlib=3.10.9
  - jupyterlab=4
  - ipykernel=7.2.0
  - nbclient=0.11.0
  - nbformat=5.10.4
  - tzdata
  - scikit-learn=1.0.2
  - "setuptools<81"
  - pip:
      - "tell==1.3.0"
      - "NREL-reV==0.9.2"
      - "NREL-PySAM==4.1.0"
      - "NREL-gaps==0.6.14"
      - "NREL-rex==0.2.86"
      - "NREL-NRWAL==0.0.11"
      # HSDS' aiobotocore dependency needs this matching AWS client stack.
      - "boto3==1.26.76"
      - "s3transfer==0.6.0"
