dry_run: true
local_data_root: "<local-data-root>"

weather:
  hsds_profile: public
  county_centroids_csv: "{inputs_root}/county_centroids/county_population_centroids_regridded.csv"

county_weather:
  sources:
    - source: wtk
      year_range: [2007, 2014]

    - source: bchrrr
      year_range: [2015, 2023]

    - source: nsrdb
      year_range: [2007, 2023]
