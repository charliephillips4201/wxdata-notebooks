<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Reviewer notebook route</title>
  <desc id="desc">Ordered data-flow notebooks feed validation and analysis notebooks.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#425466"/></marker><style>.b{stroke:#425466;stroke-width:2;rx:10}.h{font:700 19px sans-serif}.t{font:15px sans-serif}.l{stroke:#425466;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1180" height="560" fill="white"/>
  <text class="h" x="190" y="35" text-anchor="middle">Data flow</text><text class="h" x="590" y="35" text-anchor="middle">Validation</text><text class="h" x="975" y="35" text-anchor="middle">Analysis</text>
  <rect class="b" x="25" y="60" width="330" height="155" fill="#e4eef8"/><text class="t" x="45" y="90">1. County point selection</text><text class="t" x="45" y="116">2. HSDS + BA/state weather</text><text class="t" x="45" y="142">3. TELL BA load</text><text class="t" x="45" y="168">4. EIA-860 regridding</text><text class="t" x="45" y="194">5. Site CF + BA/state weighting</text>
  <rect class="b" x="25" y="275" width="330" height="120" fill="#e4eef8"/><text class="t" x="45" y="307">6. BA + pooled scenario metrics</text><text class="t" x="45" y="333">7. BA + pooled stress catalogs</text><text class="t" x="45" y="359">8. State load + GCAM</text>
  <rect class="b" x="420" y="70" width="340" height="270" fill="#e9f3e4"/><text class="t" x="440" y="110">1. All-BA load validation</text><text class="t" x="440" y="150">2. MISO subregion validation</text><text class="t" x="440" y="190">3. MISO wind/solar/load + losses</text><text class="t" x="440" y="230">4. Iowa historical/TAIESM</text><text class="t" x="460" y="258">weather, load, wind CF, solar CF</text>
  <rect class="b" x="825" y="60" width="330" height="260" fill="#f3e7ef"/><text class="t" x="845" y="90">1. MISO 2023 load-duration curve</text><text class="t" x="845" y="132">2. Pairwise pooling (Figures 5–6)</text><text class="t" x="845" y="174">3. BA + state Figures 10–11</text><text class="t" x="845" y="216">4. Satellite/reanalysis context</text><text class="t" x="845" y="258">5. Iowa seasonal risk hours</text>
  <line class="l" x1="355" y1="200" x2="410" y2="200"/><line class="l" x1="760" y1="200" x2="815" y2="200"/><line class="l" x1="355" y1="350" x2="815" y2="330"/>
  <rect class="b" x="235" y="475" width="710" height="55" fill="#fff3cf"/><text class="t" x="590" y="508" text-anchor="middle">Executed notebooks retain compact tables and figures; scratch notebook_outputs are excluded.</text>
</svg>
